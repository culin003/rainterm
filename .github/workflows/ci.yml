name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & verify (unit + architecture rules)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The default `test` task excludes @Tag("integration") tests (which need
      # a live SSH server), so this runs the unit suite plus the ArchUnit rules
      # that enforce the virtual-thread / no-HashMap / banned-API invariants.
      - name: Run unit tests and architecture rules
        run: ./gradlew test --console=plain

      - name: Compile all sources
        run: ./gradlew compileJava compileTestJava --console=plain

      # The fat jar resolves the win/mac javafx classifier jars from Maven Central,
      # so this also validates that the cross-platform packaging stays buildable.
      - name: Build cross-platform fat jar
        run: ./gradlew fatJar --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
