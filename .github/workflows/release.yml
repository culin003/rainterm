name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            pkg: deb
            artifact: "*.deb"
          - os: ubuntu-22.04-arm
            arch: arm64
            pkg: deb
            artifact: "*.deb"
          - os: windows-latest
            arch: x64
            pkg: msi
            artifact: "*.msi"
          - os: macos-14
            arch: aarch64
            pkg: dmg
            artifact: "*.dmg"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # Tests require a real SSH server; run locally with ./gradlew test
      - name: Build installer
        run: ./gradlew jpackage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raindrop-${{ matrix.arch }}
          path: build/jpackage/${{ matrix.artifact }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Raindrop ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            raindrop-amd64/*.deb
            raindrop-arm64/*.deb
            raindrop-x64/*.msi
            raindrop-aarch64/*.dmg
          draft: false
          prerelease: false
